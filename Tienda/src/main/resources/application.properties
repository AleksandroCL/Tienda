spring.application.name=tienda

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda?useSSL=false&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Opcional: crear un administrador nuevo. Nunca actualiza cuentas existentes.
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.name=${ADMIN_NAME:Administrador}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=8080

server.error.include-message=never

server.error.include-stacktrace=never

server.error.include-binding-errors=never
