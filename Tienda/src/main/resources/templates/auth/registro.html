<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('Crear cuenta — GAME HUB')}"></head>
<body class="login-body registration-page">
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <a th:href="@{/juegos}" class="btn-volver relative-z">← Volver al catálogo</a>
    <main class="auth-wrapper relative-z">
        <div class="auth-card">
            <div class="signup-top">
                <h1>Crear cuenta</h1>
                <p class="form-help">Tu próxima partida empieza aquí.</p>
                <form id="registroForm" th:action="@{/auth/registro}" th:object="${usuarioDTO}" method="post">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="auth-input" required maxlength="100" autocomplete="name"
                               aria-describedby="nombre-error" th:attr="aria-invalid=${#fields.hasErrors('nombre')}">
                        <span id="nombre-error" class="field-error" th:errors="*{nombre}"></span>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" th:field="*{email}" class="auth-input" required maxlength="150" autocomplete="email"
                               aria-describedby="email-error" th:attr="aria-invalid=${#fields.hasErrors('email')}">
                        <span id="email-error" class="field-error" th:errors="*{email}"></span>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="auth-input" required minlength="8" maxlength="72"
                               autocomplete="new-password" aria-describedby="password-help password-error"
                               th:attr="aria-invalid=${#fields.hasErrors('password')}">
                        <p class="form-help" id="password-help">Mínimo 8 caracteres, una mayúscula, un número y un símbolo como *, # o /. Los espacios no cuentan como símbolo.</p>
                        <span id="password-error" class="field-error" th:errors="*{password}"></span>
                    </div>
                    <div class="form-group">
                        <label for="confirmarPassword">Confirmar contraseña</label>
                        <input type="password" id="confirmarPassword" name="confirmarPassword" class="auth-input" required maxlength="72"
                               autocomplete="new-password" aria-describedby="confirmar-error"
                               th:attr="aria-invalid=${#fields.hasErrors('confirmarPassword')}">
                        <span id="confirmar-error" class="field-error" th:errors="*{confirmarPassword}"></span>
                    </div>
                    <button type="submit" class="auth-btn">Crear cuenta</button>
                </form>
            </div>
            <div class="signup-bottom"><a th:href="@{/auth/login}">Ya tengo una cuenta</a></div>
        </div>
    </main>
    <script th:src="@{/js/login.js}"></script>
    <script th:src="@{/js/registro.js}"></script>
</body>
</html>
