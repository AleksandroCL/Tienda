<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/layout :: head('Página no encontrada')}"></head>

<body>
    <nav th:replace="~{layout/layout :: navbar}"></nav>

    <main class="hero error-page">
        <p class="hero-eyebrow">Error 404</p>
        <h1>No encontramos <span class="hl">lo que buscas</span></h1>
        <p class="hero-sub"
            th:text="${mensajeError ?: 'La página o el registro solicitado no existe. Revisa el enlace o vuelve al catálogo.'}">
            No encontramos lo que buscabas. Puede que el enlace esté roto o que el juego ya no exista.
        </p>
        <div class="error-actions">
            <a th:href="@{/juegos}" class="store-button">Volver al catálogo</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}"
                class="store-button store-button--secondary">Ir al panel</a>
        </div>
    </main>

    <footer th:replace="~{layout/layout :: footer}"></footer>
</body>

</html>
