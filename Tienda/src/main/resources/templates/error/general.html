<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/layout :: head(${tituloError})}"></head>
<body>
    <nav th:replace="~{layout/layout :: navbar}"></nav>
    <main class="hero error-page">
        <p class="hero-eyebrow" th:text="${'Error ' + codigoError}">Error</p>
        <h1 th:text="${tituloError}">Algo salió mal</h1>
        <p class="hero-sub" th:text="${mensajeError}">Inténtalo de nuevo en unos momentos.</p>
        <div class="error-actions">
            <a th:href="@{/juegos}" class="store-button">Volver al catálogo</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="store-button store-button--secondary">Ir al panel</a>
        </div>
    </main>
    <footer th:replace="~{layout/layout :: footer}"></footer>
</body>
</html>
