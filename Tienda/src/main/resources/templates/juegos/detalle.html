<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: head(${juego.titulo} + ' - GAME HUB')}"></head>

<body>
    <nav th:replace="~{layout/layout :: navbar}"></nav>

    <main class="catalogo-container">
        <a th:href="@{/juegos}" class="btn-card" style="display:inline-block; margin-bottom: 1.5rem;">
            ← Volver al catálogo
        </a>

        <div class="detalle-juego">
            <div class="detalle-media">
                <img th:src="${juego.imagenUrl != null ? juego.imagenUrl : '/img/placeholder-juego.png'}"
                    th:alt="${juego.titulo}">
            </div>

            <div class="detalle-info">
                <h1 th:text="${juego.titulo}">Título del juego</h1>

                <div class="detalle-tags">
                    <span class="tag" th:each="categoria : ${juego.categorias}" th:text="${categoria.nombre}">
                        Categoría
                    </span>
                </div>

                <p class="detalle-precio" th:text="${'S/ ' + #numbers.formatDecimal(juego.precio, 1, 2)}">
                    S/ 0.00
                </p>

                <p class="detalle-descripcion" th:text="${juego.descripcion}">
                    Descripción del juego.
                </p>

                <ul class="detalle-meta">
                    <li>
                        <strong>Plataformas:</strong>
                        <span th:text="${#strings.listJoin(juego.plataformas.![nombre], ' · ')}">PC · PS5</span>
                    </li>
                    <li>
                        <strong>Stock disponible:</strong>
                        <span th:text="${juego.stock}">0</span>
                    </li>
                    <li th:if="${juego.fechaLanzamiento != null}">
                        <strong>Lanzamiento:</strong>
                        <span th:text="${#temporals.format(juego.fechaLanzamiento, 'dd/MM/yyyy')}">01/01/2026</span>
                    </li>
                </ul>

                <!-- Formulario para agregar al carrito desde el detalle -->
                <form th:action="@{/carrito/agregar/{id}(id=${juego.id})}" method="post">
                    <button type="submit" class="auth-btn"
                        style="max-width: 280px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="20" r="1"></circle>
                            <circle cx="20" cy="20" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        Agregar al carrito
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout/layout :: footer}"></footer>
</body>

</html>
